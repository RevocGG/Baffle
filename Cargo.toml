[package]
name = "baffle"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Smart adaptive loudness for movies: keeps quiet dialogue audible and tames loud explosions."
license = "MIT"

[features]
no-engine = []

[dependencies]
ab_glyph = "0.2"          # font validation for system-font loading (also in tree via epaint)
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
eframe = { version = "0.31", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
    "accesskit",
] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSObject", "NSString"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = { version = "0.3", features = ["CMBlockBuffer", "CMFormatDescription", "CMBase"] }
objc2-core-audio-types = "0.3"
objc2-core-audio = "0.3"
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
